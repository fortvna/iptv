name: Assemble playlist
on:
  push:
    paths:
      - "parts/**"
      - ".github/workflows/assemble.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts into playlist.m3u
        run: |
          set -euo pipefail
          cat parts/playlist.part01.m3u parts/playlist.part02.m3u parts/playlist.part03.m3u > playlist.m3u
          wc -l playlist.m3u
          grep -c "^#EXTINF" playlist.m3u
      - name: Commit assembled playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "No playlist change"
          else
            git commit -m "Assemble exact-name-deduped playlist.m3u"
            git push
          fi
